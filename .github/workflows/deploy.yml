name: Deploy to cPanel

on:
  # Allows you to click a button in GitHub to deploy
  workflow_dispatch: 
  # Runs on pushes to your branch
  push:
    branches:
      - mylib-react  # <-- Change this if your branch is named differently

jobs:
  # ==========================================
  # JOB 1: Build the React App
  # ==========================================
  build:
    # Only run if manually triggered OR if commit message contains "DEPLOY"
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'DEPLOY'))
    
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    - name: Build Project
      run: npm run build

    - name: Copy .htaccess
      run: cp .htaccess dist/.htaccess

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: dist/

  # ==========================================
  # JOB 2: Deploy the Build to cPanel
  # ==========================================
  deploy:
    needs: build
    # Only run if the build job succeeded
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'DEPLOY'))
    
    runs-on: ubuntu-latest
    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: production-build
        path: dist

    - name: Setup SSH Agent
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts
        eval $(ssh-agent -s)
        ssh-add ~/.ssh/id_ed25519

    - name: Test SSH Connection
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "echo 'SSH Connection Successful!'"

    - name: Push to cPanel Git
      run: |
        git init
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add dist
        git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        git remote add cpanel ssh://${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}${{ secrets.CPANEL_REPO_PATH }}
        git push cpanel HEAD:mylib-react --force

    - name: Trigger cPanel Deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.CPANEL_SSH_KEY }}
        script: |
          /usr/bin/uapi VersionControlDeployment create repository_root=${{ secrets.CPANEL_REPO_PATH }}