name: Deploy to cPanel via FTP

on:
  # Allows you to click a button in GitHub to deploy
  workflow_dispatch: 
  # Runs on pushes to your branch
  push:
    branches:
      - mylib-react

jobs:
  build-and-deploy:
    # Only run if manually triggered OR if commit message contains "DEPLOY"
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'DEPLOY'))
    
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    - name: Build Project
      run: npm run build

    - name: Copy .htaccess
      run: cp .htaccess dist/.htaccess

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: ${{ secrets.FTP_SERVER_DIR }}
        dangerous-clean-slate: false